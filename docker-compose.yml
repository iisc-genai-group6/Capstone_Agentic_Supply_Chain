services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: agentic_scd_app
    environment:
      AGENTIC_SCD_HOME: /app/.agentic_scd
      DATABASE_URL: sqlite:////app/.agentic_scd/agentic_scd.sqlite
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-true}
      GRADIO_SERVER_NAME: 0.0.0.0
    ports:
      - "7860:7860"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./.agentic_scd:/app/.agentic_scd
    command: ["agentic-scd-dashboard"]
