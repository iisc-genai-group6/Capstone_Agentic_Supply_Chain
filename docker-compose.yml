# Dev + demo stack: a local Postgres, an idle `app` container (Python 3.11 + uv + the
# project), the FastAPI service (`api` -> localhost:8000), and the React + Ant Design
# product UI (`frontend` -> localhost:3001). `docker compose up` starts postgres, the
# API, and the React UI; the `app` container stays idle so you can still exec the Gradio
# dashboard or Jupyter into it. Values are read from the project-root `.env` (Compose
# loads it automatically).
#
#   docker compose up -d                 # build + start postgres, api, frontend, idle app
#   docker compose up -d postgres        # just the database (local `uv` workflow)
#   # -> React UI:   http://localhost:3001   (product-facing, calls the API)
#   # -> FastAPI:    http://localhost:8000/docs
#   docker compose exec app uv run agentic-scd            # CLI run
#   docker compose exec app uv run agentic-scd-dashboard  # Gradio -> localhost:7860
#   docker compose exec app uv run jupyter lab --ip 0.0.0.0  # Jupyter -> localhost:8888
#   docker compose ps                    # services should report "healthy"/"running"
#   docker compose down                  # stop; data persists on the pgdata volume
#   docker compose down -v               # also drop the volume (wipes the data)

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentic_scd_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agentic_scd_app
    container_name: agentic_scd_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the app container the DB is the `postgres` service, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_scd}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-genAI}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      APP_NAME: ${APP_NAME:-agentic-scd}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-local}
      # Bind Gradio to 0.0.0.0 so the published port is reachable from the host.
      GRADIO_SERVER_NAME: 0.0.0.0
    ports:
      - "7860:7860"   # Gradio dashboard
      - "8888:8888"   # Jupyter
    volumes:
      # Live edits: notebooks and source are bind-mounted; the in-image .venv is kept.
      - ./backend/notebooks:/app/notebooks
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
    # Idle so the infra is "up" but no run mode is chosen for you (exec one in).
    command: ["sleep", "infinity"]
    restart: unless-stopped

  # FastAPI service wrapping the LangGraph pipeline. Reuses the app image and runs
  # `agentic-scd-api`, binding 0.0.0.0 so localhost:8000 is reachable from the host
  # and from the React UI. This is what the product-facing frontend calls.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: agentic_scd_app
    container_name: agentic_scd_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentic}:${POSTGRES_PASSWORD:-agentic}@postgres:5432/${POSTGRES_DB:-agentic_scd}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      USE_MOCK_LLM: ${USE_MOCK_LLM:-false}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-genAI}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      APP_NAME: ${APP_NAME:-agentic-scd}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      APP_ENV: ${APP_ENV:-local}
      # Bind uvicorn to 0.0.0.0 so the published port is reachable from the host.
      API_HOST: 0.0.0.0
    ports:
      - "8000:8000"   # FastAPI (also serves /docs)
    volumes:
      # Live edits mirror the app container so the API reloads the same source.
      - ./backend/src:/app/src
    command: ["uv", "run", "agentic-scd-api"]
    restart: unless-stopped

  # React + Ant Design product UI, built with Vite and served by nginx. The browser
  # calls same-origin /api/*; nginx in this container proxies to the `api` service.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: agentic_scd_frontend
    container_name: agentic_scd_frontend
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3001}:80"     # React UI (3001 often taken by Grafana)
    restart: unless-stopped

volumes:
  pgdata:
