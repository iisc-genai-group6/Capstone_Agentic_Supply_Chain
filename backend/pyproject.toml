[project]
name = "agentic-scd"
version = "0.1.0"
description = "Agentic Supply Chain Disruption Predictor & Simulation Engine (capstone POC)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.1",
    "langsmith>=0.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "groq>=0.11",
    "psycopg[binary]>=3.3.4",
    "feedparser>=6.0.12",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "fastapi>=0.137.2",
    "uvicorn>=0.49.0",
    "apscheduler>=3.11.2",
    "gradio>=6.19.0",
    "simpy>=4.1",
    "prophet>=1.1",
    "pandas>=2.0",
]

[project.scripts]
agentic-scd = "agentic_scd.__main__:main"
agentic-scd-api = "agentic_scd.api.app:main"
agentic-scd-collect = "agentic_scd.ingestion.collect:main"
agentic-scd-batch = "agentic_scd.ingestion.batch_cli:main"
agentic-scd-ingest = "agentic_scd.ingestion.service:main"
agentic-scd-dashboard = "agentic_scd.ui.gradio_app:main"
agentic-scd-vectorize = "agentic_scd.rag.vectorize:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Phase 2.5 — interactive dev notebooks (not a runtime dep). Install with
# `uv sync --group notebooks`, launch with `uv run jupyter lab`.
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_scd"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Auxiliary doc-generation scripts are not part of the package and are not
# held to the project lint/format bar.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files re-export their public API; the imports are
# intentional even though they are not used within the file itself.
"**/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
